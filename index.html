<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>入庫記録（モーター）</title>
</head>
<body>
  <header class="app-header">
    <h1>入庫記録</h1>
    <span id="count-badge" class="count-badge">0 件</span>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="scan">スキャン</button>
    <button class="tab-btn" data-tab="records">記録一覧</button>
  </nav>

  <!-- ===== スキャンタブ ===== -->
  <section id="tab-scan" class="tab-panel active">
    <div class="scanner-wrap">
      <video id="video" playsinline muted></video>
      <div class="scan-frame"></div>
      <div id="scan-status" class="scan-status">カメラを起動してください</div>
    </div>

    <div class="scan-controls">
      <button id="btn-start" class="btn btn-primary">カメラ開始</button>
      <button id="btn-stop" class="btn btn-ghost" hidden>停止</button>
    </div>

    <form id="entry-form" class="entry-form" autocomplete="off">
      <p class="form-hint" id="form-hint">QR・バーコードを読み取ると内容が反映されます（オフライン・AI不使用）。三菱製QRはシリアルを自動抽出。型番はプルダウンから選択（無ければ「その他」で手入力）。入庫日付は当日が既定。シリアルは空欄でも保存できます。</p>

      <label>
        型番
        <select id="field-model" required>
          <option value="" disabled selected>型番を選択…</option>
        </select>
      </label>

      <label id="model-other-wrap" hidden>
        型番（手入力）<span class="opt">リストに無い型番</span>
        <input type="text" id="field-model-other" placeholder="例: EF-99XYZ9-V">
      </label>

      <label>
        シリアル<span class="opt">（任意・空欄可）</span>
        <div class="input-row">
          <input type="text" id="field-serial" placeholder="例: 260312002A（SW系は空欄でも可）">
          <button type="button" class="mini-btn" data-fill="serial" title="読取値をシリアルへ">← 読取</button>
        </div>
      </label>

      <div class="two-col">
        <label>
          入庫数
          <input type="number" id="field-qty" value="1" min="1" step="1" inputmode="numeric" required>
        </label>
        <label>
          入庫日付
          <input type="date" id="field-date" required>
        </label>
      </div>

      <div class="raw-box" id="raw-box" hidden>
        <span class="raw-label">読取値 <span id="raw-format" class="raw-format"></span></span>
        <code id="raw-value"></code>
      </div>

      <button type="submit" class="btn btn-primary btn-block">記録を保存</button>
    </form>
  </section>

  <!-- ===== 記録一覧タブ ===== -->
  <section id="tab-records" class="tab-panel">
    <div class="records-toolbar">
      <input type="search" id="search-input" placeholder="型番・シリアルで検索">
      <button id="btn-export" class="btn btn-ghost">CSV書出</button>
    </div>
    <div id="records-list" class="records-list"></div>
    <p id="records-empty" class="records-empty">まだ記録がありません。</p>
  </section>

  <div id="toast" class="toast"></div>

  <script src="vendor/zxing.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
